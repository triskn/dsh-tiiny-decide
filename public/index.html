<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="TiinyDecide is a local workbench for building, running, and inspecting structured model decisions.">
  <title>TiinyDecide – Decision Workbench</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="rail">
      <a class="brand" href="#workflows" aria-label="Tiiny Decide home">
        <img src="/icon.svg" alt="" width="38" height="38">
        <span><strong>tiiny<span class="brand-accent">.</span>decide</strong><small>Decision workbench</small></span>
      </a>
      <div class="rail-label">Workspace</div>
      <nav class="nav" aria-label="Workspace">
        <a class="nav-link" href="#workflows" data-tab="workflows" aria-current="page"><span data-icon="workflows"></span><span>Workflows</span></a>
        <a class="nav-link" href="#connections" data-tab="connections"><span data-icon="connections"></span><span>Connections</span></a>
        <a class="nav-link" href="#runs" data-tab="runs"><span data-icon="runs"></span><span>Runs</span><span id="run-count" class="nav-count" hidden></span></a>
      </nav>
      <div class="rail-bottom">
        <div class="rail-note"><span data-icon="shield"></span><div><strong>Local workspace</strong><p>Workflows and run history are managed by your workbench.</p></div></div>
        <div class="rail-foot"><span class="status-dot"></span> Browser workspace</div>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-divider" aria-hidden="true">/</span><strong id="breadcrumb-page">Workflows</strong></div>
        <a class="top-connection" href="#connections" id="connection-indicator"><span class="status-dot muted"></span><span>No connection selected</span></a>
      </header>
      <div class="viewport" id="viewport"><p class="startup" role="status">Opening your workbench…</p></div>
      <noscript><p class="startup">Enable JavaScript to open the Tiiny Decide workbench.</p></noscript>
    </main>
  </div>
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
